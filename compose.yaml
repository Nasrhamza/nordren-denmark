services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: nordren
      POSTGRES_USER: nordren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordren -d nordren"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5174
      DATABASE_URL: postgresql://nordren:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/nordren
    ports:
      - "127.0.0.1:5174:5174"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  postgres_data:
